name: Install GA4 on live Pages branch

on:
  push:
    branches:
      - repair/github-pages-visual-recovery
    paths:
      - .github/workflows/install-live-ga.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live Pages branch
        uses: actions/checkout@v6
        with:
          ref: repair/github-pages-visual-recovery

      - name: Install exact Google tag and funnel events
        shell: python
        run: |
          from pathlib import Path

          measurement_id = "G-LQPJNWQB9V"
          tag = '''  <!-- Google tag (gtag.js) -->
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-LQPJNWQB9V"></script>
            <script>
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());

              gtag('config', 'G-LQPJNWQB9V');
            </script>
          '''

          html_files = [
              Path("index.html"),
              Path("404.html"),
              Path("about/index.html"),
              Path("services/index.html"),
              Path("capabilities/index.html"),
              Path("contact/index.html"),
          ]

          old_footer = "No contact form, analytics, advertising pixels, or nonessential cookies."
          new_footer = (
              "No contact form or advertising pixels. This site uses Google Analytics to measure "
              "visits and outbound-link activity; Google Analytics may use cookies or similar identifiers."
          )

          old_privacy = (
              "This static website has no contact form, user account, analytics, advertising pixel, or nonessential cookie. "
              "Selecting an email or telephone link opens the service on your device; SyNERDgy receives only the information "
              "you choose to send through that channel."
          )
          new_privacy = (
              "This static website has no contact form or user account. It uses Google Analytics to measure visits, traffic "
              "sources, and outbound-link activity; Google Analytics may use cookies or similar identifiers for measurement. "
              "Selecting an email or telephone link opens the service on your device; SyNERDgy receives only the information "
              "you choose to send through that channel."
          )

          for path in html_files:
              text = path.read_text(encoding="utf-8")
              if measurement_id not in text:
                  if "<head>\n" not in text:
                      raise RuntimeError(f"Missing <head> in {path}")
                  text = text.replace("<head>\n", "<head>\n" + tag, 1)
              text = text.replace(old_footer, new_footer)
              text = text.replace(old_privacy, new_privacy)
              path.write_text(text, encoding="utf-8")

          js_path = Path("assets/js/main.js")
          js = js_path.read_text(encoding="utf-8")
          marker = "BEGIN SYNERDGY FUNNEL ANALYTICS"
          if marker not in js:
              block = r'''

            // BEGIN SYNERDGY FUNNEL ANALYTICS
            const safeAnalyticsText = (value) => String(value || '').trim().replace(/\s+/g, ' ').slice(0, 120);

            const sendAnalyticsEvent = (eventName, parameters = {}) => {
              if (typeof window.gtag !== 'function') return;
              window.gtag('event', eventName, parameters);
            };

            document.addEventListener('click', (event) => {
              if (!(event.target instanceof Element)) return;
              const link = event.target.closest('a[href]');
              if (!link) return;

              const href = link.getAttribute('href') || '';
              const linkText = safeAnalyticsText(link.textContent || link.getAttribute('aria-label'));
              const sourcePage = window.location.pathname;

              if (href.startsWith('mailto:')) {
                sendAnalyticsEvent('contact_email_click', {
                  link_url: href,
                  link_text: linkText,
                  source_page: sourcePage
                });
                return;
              }

              let url;
              try {
                url = new URL(href, window.location.href);
              } catch {
                return;
              }

              const hostname = url.hostname.toLowerCase();
              const isFlevy = hostname === 'flevy.com' || hostname.endsWith('.flevy.com');

              if (isFlevy) {
                sendAnalyticsEvent('flevy_outbound_click', {
                  link_url: url.href,
                  link_text: linkText,
                  source_page: sourcePage,
                  product_id: safeAnalyticsText(link.dataset.productId)
                });
                return;
              }

              if (url.origin === window.location.origin) {
                if (/(^|\/)contact\/?$/.test(url.pathname)) {
                  sendAnalyticsEvent('contact_cta_click', {
                    link_url: url.href,
                    link_text: linkText,
                    source_page: sourcePage
                  });
                }
                return;
              }

              sendAnalyticsEvent('outbound_click', {
                link_url: url.href,
                link_domain: hostname,
                link_text: linkText,
                source_page: sourcePage
              });
            }, { capture: true });
            // END SYNERDGY FUNNEL ANALYTICS
          '''
              closing = "\n})();"
              if closing not in js:
                  raise RuntimeError("Could not find main.js closing wrapper")
              js = js.replace(closing, block + closing, 1)
              js_path.write_text(js, encoding="utf-8")

      - name: Commit live analytics installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html about/index.html services/index.html capabilities/index.html contact/index.html assets/js/main.js
          if git diff --cached --quiet; then
            echo "Analytics already installed"
            exit 0
          fi
          git commit -m "Install GA4 on live Pages site"
          git push origin HEAD:repair/github-pages-visual-recovery
