name: Deploy repair branch to GitHub Pages

on:
  push:
    branches:
      - repair/github-pages-visual-recovery
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-repair
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure production project path
        run: python3 scripts/configure_site_url.py https://brandys-algorythem.github.io/SyNERDgySolutions

      - name: Validate configured site
        run: python3 scripts/validate_site.py

      - name: Build tracked Flevy routes
        run: python3 scripts/flevy_automation.py build

      - name: Verify Flevy route manifest
        run: |
          test -f go/links.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('go/links.json').read_text())
          if not data.get('links'):
              raise SystemExit('No active Flevy tracking routes were generated')
          print(f"Generated {len(data['links'])} tracked Flevy routes")
          PY

      - name: Stage public files
        run: |
          mkdir _site
          cp index.html 404.html site.webmanifest robots.txt sitemap.xml _site/
          cp -R about assets capabilities contact services go _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
