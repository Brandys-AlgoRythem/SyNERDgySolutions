name: Deploy repair branch to GitHub Pages

on:
  push:
    branches:
      - repair/github-pages-visual-recovery
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-repair
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select GitHub Actions as the Pages source
        uses: actions/github-script@v8
        with:
          script: |
            await github.request("PUT /repos/{owner}/{repo}/pages", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: "workflow",
              headers: {
                "X-GitHub-Api-Version": "2022-11-28"
              }
            });

      - name: Configure production project path
        run: python3 scripts/configure_site_url.py https://brandys-algorythem.github.io/SyNERDgySolutions

      - name: Validate configured site
        run: python3 scripts/validate_site.py

      - name: Stage public files
        run: |
          mkdir _site
          cp index.html 404.html site.webmanifest robots.txt sitemap.xml _site/
          cp -R about assets capabilities contact services _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
