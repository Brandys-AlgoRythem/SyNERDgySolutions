name: Flevy public visibility watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"
  push:
    branches:
      - repair/github-pages-visual-recovery
    paths:
      - data/flevy-products.json
      - scripts/flevy_automation.py
      - .github/workflows/flevy-visibility.yml

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out live Pages branch
        uses: actions/checkout@v6
        with:
          ref: repair/github-pages-visual-recovery

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Snapshot public Flevy signals
        run: python3 scripts/flevy_automation.py watch

      - name: Add snapshot to workflow summary
        if: always()
        run: |
          if [ -f data/flevy-visibility/summary.md ]; then
            cat data/flevy-visibility/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flevy-visibility-${{ github.run_number }}
          path: data/flevy-visibility/
          retention-days: 90

      - name: Persist visibility history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flevy-visibility
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "Update Flevy public visibility snapshot"
          git push
